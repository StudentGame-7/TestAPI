<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="แสดงรายการอุปกรณ์จาก RESTful API ด้วย Bootstrap"
    />
    <title>Object Explorer | RESTful API</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #17243a;
        --muted: #6f7d93;
        --line: #e8edf4;
        --accent: #4b67e8;
        --accent-soft: #eef1ff;
        --surface: #ffffff;
        --page: #f5f7fb;
      }

      body {
        background: var(--page);
        color: var(--ink);
        font-family: "Kanit", sans-serif;
        min-height: 100vh;
      }

      .brand-font,
      .display-5,
      .table,
      .badge,
      .btn {
        font-family: "Space Grotesk", "Kanit", sans-serif;
      }

      .hero {
        background: linear-gradient(125deg, #192a55 0%, #344da2 62%, #5274f2 100%);
        min-height: 265px;
        overflow: hidden;
        position: relative;
      }

      .hero::after {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        content: "";
        height: 420px;
        position: absolute;
        right: -100px;
        top: -180px;
        width: 420px;
      }

      .hero .container {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        color: #cbd5ff;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .hero-copy {
        color: #dbe3ff;
        max-width: 560px;
      }

      .content-wrap {
        margin-top: -48px;
        position: relative;
        z-index: 2;
      }

      .data-card {
        background: var(--surface);
        border: 1px solid rgba(224, 230, 241, 0.8);
        border-radius: 14px;
        box-shadow: 0 18px 55px rgba(35, 50, 85, 0.11);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .stat-value {
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.45rem;
        font-weight: 700;
      }

      .api-url {
        background: #f8f9fc;
        border: 1px solid var(--line);
        color: #526079;
        font-family: "Space Grotesk", monospace;
        font-size: 0.77rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .table thead th {
        background: #f8f9fc;
        border-bottom: 1px solid var(--line);
        color: #66738a;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 1rem 1.25rem;
        text-transform: uppercase;
      }

      .table tbody td {
        border-color: var(--line);
        padding: 1rem 1.25rem;
        vertical-align: middle;
      }

      .table tbody tr:hover {
        background: #fbfcff;
      }

      .object-id {
        background: var(--accent-soft);
        border-radius: 6px;
        color: #4059d2;
        font-family: "Space Grotesk", monospace;
        font-size: 0.8rem;
        padding: 0.35rem 0.55rem;
      }

      .name-cell {
        font-weight: 500;
      }

      .empty-state {
        color: var(--muted);
        padding: 3.5rem 1rem !important;
        text-align: center;
      }

      .spinner-border {
        color: var(--accent);
      }

      .btn-primary {
        --bs-btn-bg: var(--accent);
        --bs-btn-border-color: var(--accent);
        --bs-btn-hover-bg: #3c56d2;
        --bs-btn-hover-border-color: #3c56d2;
        box-shadow: 0 7px 16px rgba(75, 103, 232, 0.22);
      }

      @media (max-width: 575.98px) {
        .hero {
          min-height: 310px;
        }

        .content-wrap {
          margin-top: -30px;
        }

        .table thead th,
        .table tbody td {
          padding-left: 0.85rem;
          padding-right: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero text-white">
      <div class="container py-5">
        <div class="eyebrow mb-3">RESTful API / Object Explorer</div>
        <h1 class="display-5 fw-semibold mb-2">รายการอุปกรณ์</h1>
        <p class="hero-copy fs-5 mb-0">
          สำรวจข้อมูลจาก API ได้ในมุมมองที่อ่านง่าย พร้อมรีเฟรชข้อมูลล่าสุดได้ทันที
        </p>
      </div>
    </header>

    <main class="container content-wrap pb-5">
      <section class="data-card overflow-hidden">
        <div class="border-bottom p-4 p-md-5 pb-4">
          <div class="align-items-center d-flex flex-wrap gap-3 justify-content-between">
            <div>
              <div class="stat-label mb-1">จำนวนรายการทั้งหมด</div>
              <div class="stat-value" id="totalCount">-</div>
            </div>
            <button class="btn btn-primary px-4" id="refreshButton" type="button">
              <span class="me-2" aria-hidden="true">↻</span> รีเฟรชข้อมูล
            </button>
          </div>
          <div class="api-url mt-4 px-3 py-2" title="https://api.restful-api.dev/objects">
            GET&nbsp;&nbsp;https://api.restful-api.dev/objects
          </div>
        </div>

        <div class="alert alert-danger d-none m-4" id="errorMessage" role="alert"></div>

        <div class="table-responsive">
          <table class="table mb-0" aria-describedby="tableStatus">
            <thead>
              <tr>
                <th scope="col">ลำดับ</th>
                <th scope="col">รหัส</th>
                <th scope="col">ชื่ออุปกรณ์</th>
                <th scope="col">รายละเอียด</th>
              </tr>
            </thead>
            <tbody id="objectTableBody">
              <tr>
                <td class="empty-state" colspan="4">
                  <div class="spinner-border mb-3" role="status" aria-label="กำลังโหลด"></div>
                  <div>กำลังโหลดข้อมูล...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="border-top px-4 py-3" id="tableStatus" role="status">
          <small class="text-secondary">กำลังเชื่อมต่อกับ API</small>
        </div>
      </section>
    </main>

    <script>
      const apiUrl = "https://api.restful-api.dev/objects";
      const tableBody = document.getElementById("objectTableBody");
      const totalCount = document.getElementById("totalCount");
      const errorMessage = document.getElementById("errorMessage");
      const tableStatus = document.getElementById("tableStatus");
      const refreshButton = document.getElementById("refreshButton");

      function escapeHtml(value) {
        return String(value ?? "-")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderRows(objects) {
        totalCount.textContent = objects.length.toLocaleString("th-TH");
        tableBody.innerHTML = objects.length
          ? objects
              .map(
                (object, index) => `
                  <tr>
                    <td class="text-secondary">${index + 1}</td>
                    <td><span class="object-id">${escapeHtml(object.id)}</span></td>
                    <td class="name-cell">${escapeHtml(object.name)}</td>
                    <td>${escapeHtml(object.data ? JSON.stringify(object.data) : "-")}</td>
                  </tr>`,
              )
              .join("")
          : '<tr><td class="empty-state" colspan="4">ไม่พบข้อมูลจาก API</td></tr>';

        tableStatus.innerHTML = `<small class="text-secondary">อัปเดตล่าสุด: ${new Date().toLocaleString("th-TH")}</small>`;
      }

      async function loadObjects() {
        refreshButton.disabled = true;
        refreshButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>กำลังโหลด';
        errorMessage.classList.add("d-none");
        tableBody.innerHTML = '<tr><td class="empty-state" colspan="4"><div class="spinner-border mb-3" role="status" aria-label="กำลังโหลด"></div><div>กำลังโหลดข้อมูล...</div></td></tr>';
        tableStatus.innerHTML = '<small class="text-secondary">กำลังเชื่อมต่อกับ API</small>';

        try {
          const response = await fetch(apiUrl, { method: "GET" });
          if (!response.ok) {
            throw new Error(`API ตอบกลับด้วยสถานะ ${response.status}`);
          }

          const objects = await response.json();
          renderRows(Array.isArray(objects) ? objects : []);
        } catch (error) {
          totalCount.textContent = "-";
          tableBody.innerHTML = '<tr><td class="empty-state" colspan="4">ไม่สามารถแสดงข้อมูลได้</td></tr>';
          errorMessage.textContent = `เกิดข้อผิดพลาด: ${error.message}`;
          errorMessage.classList.remove("d-none");
          tableStatus.innerHTML = '<small class="text-danger">เชื่อมต่อ API ไม่สำเร็จ</small>';
        } finally {
          refreshButton.disabled = false;
          refreshButton.innerHTML = '<span class="me-2" aria-hidden="true">↻</span> รีเฟรชข้อมูล';
        }
      }

      refreshButton.addEventListener("click", loadObjects);
      loadObjects();
    </script>
  </body>
</html>
